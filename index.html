<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido de Pupusas</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      margin: 0;
      padding: 20px;
    }
    .contenedor {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      text-align: center;
    }
    .subtitulo {
      text-align: center;
      color: #6b7280;
      font-size: 0.92rem;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 14px;
      font-family: inherit;
    }
    .fila-nombre {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .fila-nombre input {
      margin-bottom: 0;
      flex: 1;
    }
    .btn-buscar {
      width: auto;
      white-space: nowrap;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-buscar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .aviso-edicion {
      display: none;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .item-pupusa {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .item-pupusa:last-of-type {
      border-bottom: none;
      margin-bottom: 14px;
    }
    .precio-unit {
      font-size: 0.85rem;
      color: #6b7280;
    }
    .contador {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .contador button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }
    .contador span {
      min-width: 22px;
      text-align: center;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .total-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      font-weight: 700;
      color: #166534;
      margin-bottom: 16px;
    }
    .btn-guardar {
      width: 100%;
      padding: 13px;
      background: #16a34a;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-guardar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .mensaje {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .mensaje.ok {
      display: block;
      background: #dcfce7;
      color: #166534;
    }
    .mensaje.err {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>Pedido de Pupusas</h1>
    <p class="subtitulo">Escribe tu nombre. Si ya pediste, toca "Editar mi pedido".</p>

    <form id="formPedido">
      <label for="nombre">Tu Nombre *</label>
      <div class="fila-nombre">
        <input type="text" id="nombre" placeholder="Ej. Juan" required />
        <button type="button" class="btn-buscar" id="btnBuscar">Editar mi pedido</button>
      </div>

      <div class="aviso-edicion" id="avisoEdicion">
        Pedido encontrado. Modifica lo que quieras y presiona <strong>Guardar pedido</strong>.
      </div>

      <label for="masa">Tipo de masa</label>
      <select id="masa">
        <option value="Maíz">Maíz</option>
        <option value="Arroz">Arroz</option>
      </select>

      <label>Pupusas</label>
      <div class="item-pupusa">
        <div>
          <strong>Revueltas</strong>
          <div class="precio-unit" id="lbl-precio-1">$1.00</div>
        </div>
        <div class="contador">
          <button type="button" data-tipo="revueltas" data-delta="-1">-</button>
          <span id="val-revueltas">0</span>
          <button type="button" data-tipo="revueltas" data-delta="1">+</button>
        </div>
      </div>

      <div class="item-pupusa">
        <div>
          <strong>Frijol con queso</strong>
          <div class="precio-unit" id="lbl-precio-2">$1.00</div>
        </div>
        <div class="contador">
          <button type="button" data-tipo="frijol_queso" data-delta="-1">-</button>
          <span id="val-frijol_queso">0</span>
          <button type="button" data-tipo="frijol_queso" data-delta="1">+</button>
        </div>
      </div>

      <div class="item-pupusa">
        <div>
          <strong>Queso</strong>
          <div class="precio-unit" id="lbl-precio-3">$1.00</div>
        </div>
        <div class="contador">
          <button type="button" data-tipo="queso" data-delta="-1">-</button>
          <span id="val-queso">0</span>
          <button type="button" data-tipo="queso" data-delta="1">+</button>
        </div>
      </div>

      <label for="bebida">Bebida</label>
      <select id="bebida">
        <option value="Ninguna" data-precio="0.00">Ninguna ($0.00)</option>
        <option value="Soda en lata" data-precio="1.00">Soda en lata ($1.00)</option>
        <option value="Café" data-precio="0.35">Café ($0.35)</option>
        <option value="Botella con agua" data-precio="0.65">Botella con agua ($0.65)</option>
        <option value="Gatorade" data-precio="1.25">Gatorade ($1.25)</option>
        <option value="Té frío" data-precio="1.00">Té frío ($1.00)</option>
        <option value="Cascada 355 ml" data-precio="0.40">Cascada 355 ml ($0.40)</option>
      </select>

      <label for="notas">Notas (opcional)</label>
      <textarea id="notas" rows="2" placeholder="Ej. Salsa y curtido aparte, bien doradas..."></textarea>

      <div class="total-box">
        <span>Total a pagar:</span>
        <span id="totalTexto">$0.00</span>
      </div>

      <button type="submit" class="btn-guardar" id="btnGuardar">Guardar pedido</button>
      <div class="mensaje" id="mensajeBox"></div>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://sojecxchvkyqekfujwjy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_43lJm-CFa47uRiPB_OXmpw_CEsU9wzR';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PRECIO_PUPUSA = 1.00;
    const cantidades = {
      revueltas: 0,
      frijol_queso: 0,
      queso: 0
    };

    const bebidaSelect = document.getElementById('bebida');
    const totalTexto = document.getElementById('totalTexto');
    const mensajeBox = document.getElementById('mensajeBox');
    const avisoEdicion = document.getElementById('avisoEdicion');
    const btnBuscar = document.getElementById('btnBuscar');
    const btnGuardar = document.getElementById('btnGuardar');

    ['lbl-precio-1', 'lbl-precio-2', 'lbl-precio-3'].forEach((id) => {
      document.getElementById(id).textContent = `$${PRECIO_PUPUSA.toFixed(2)}`;
    });

    function actualizarVista() {
      document.getElementById('val-revueltas').textContent = cantidades.revueltas;
      document.getElementById('val-frijol_queso').textContent = cantidades.frijol_queso;
      document.getElementById('val-queso').textContent = cantidades.queso;

      const totalPupusas = cantidades.revueltas + cantidades.frijol_queso + cantidades.queso;
      const precioBebida = parseFloat(bebidaSelect.selectedOptions[0].dataset.precio || '0');
      const total = (totalPupusas * PRECIO_PUPUSA) + precioBebida;

      totalTexto.textContent = `$${total.toFixed(2)}`;
      return total;
    }

    document.querySelectorAll('.contador button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tipo = btn.dataset.tipo;
        const delta = parseInt(btn.dataset.delta, 10);
        cantidades[tipo] = Math.max(0, cantidades[tipo] + delta);
        actualizarVista();
      });
    });

    bebidaSelect.addEventListener('change', actualizarVista);

    function mostrarMensaje(texto, tipo) {
      mensajeBox.textContent = texto;
      mensajeBox.className = `mensaje ${tipo}`;
    }

    btnBuscar.addEventListener('click', async () => {
      const nombreVal = document.getElementById('nombre').value.trim();
      mensajeBox.className = 'mensaje';

      if (!nombreVal) {
        mostrarMensaje('Escribe tu nombre primero para buscar tu pedido.', 'err');
        return;
      }

      btnBuscar.disabled = true;
      btnBuscar.textContent = 'Buscando...';

      const { data, error } = await supabase.rpc('buscar_pedido_por_nombre', {
        p_nombre: nombreVal
      });

      btnBuscar.disabled = false;
      btnBuscar.textContent = 'Editar mi pedido';

      if (error) {
        mostrarMensaje('Error al buscar: ' + error.message, 'err');
        return;
      }

      if (!data || data.length === 0) {
        avisoEdicion.style.display = 'none';
        mostrarMensaje('No hay ningún pedido con ese nombre. Llénalo y guárdalo como nuevo.', 'err');
        return;
      }

      const p = data[0];
      cantidades.revueltas = p.revueltas || 0;
      cantidades.frijol_queso = p.frijol_queso || 0;
      cantidades.queso = p.queso || 0;

      document.getElementById('masa').value = p.masa || 'Maíz';
      document.getElementById('notas').value = p.notas || '';

      const existeBebida = Array.from(bebidaSelect.options).some((opt) => opt.value === p.bebida);
      bebidaSelect.value = existeBebida ? p.bebida : 'Ninguna';

      actualizarVista();
      avisoEdicion.style.display = 'block';
    });

    document.getElementById('formPedido').addEventListener('submit', async (e) => {
      e.preventDefault();
      mensajeBox.className = 'mensaje';

      const nombre = document.getElementById('nombre').value.trim();
      const masa = document.getElementById('masa').value;
      const bebida = bebidaSelect.value;
      const notas = document.getElementById('notas').value.trim();
      const total = actualizarVista();

      const totalPupusas = cantidades.revueltas + cantidades.frijol_queso + cantidades.queso;
      if (totalPupusas === 0 && bebida === 'Ninguna') {
        mostrarMensaje('Selecciona al menos una pupusa o bebida.', 'err');
        return;
      }

      btnGuardar.disabled = true;
      btnGuardar.textContent = 'Guardando...';

      const { data: accion, error } = await supabase.rpc('guardar_o_editar_pedido', {
        p_nombre: nombre,
        p_revueltas: cantidades.revueltas,
        p_frijol_queso: cantidades.frijol_queso,
        p_queso: cantidades.queso,
        p_masa: masa,
        p_bebida: bebida,
        p_notas: notas,
        p_total: total
      });

      btnGuardar.disabled = false;
      btnGuardar.textContent = 'Guardar pedido';

      if (error) {
        mostrarMensaje('No se pudo guardar: ' + error.message, 'err');
        return;
      }

      avisoEdicion.style.display = 'none';
      mostrarMensaje(
        accion === 'actualizado'
          ? '¡Tu pedido fue actualizado correctamente!'
          : '¡Pedido guardado correctamente!',
        'ok'
      );
    });
  </script>
</body>
</html>
